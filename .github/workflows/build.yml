name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0   # tags, for git describe

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo vendor/rpi-image-gen/install_deps.sh
          sudo apt-get install -y bats uidmap podman device-tree-compiler

      - name: Ensure subordinate uid/gid range for the runner user
        run: |
          user=$(id -un)
          grep -q "^$user:" /etc/subuid || echo "$user:100000:65536" | sudo tee -a /etc/subuid
          grep -q "^$user:" /etc/subgid || echo "$user:100000:65536" | sudo tee -a /etc/subgid
          grep "^$user:" /etc/subuid /etc/subgid

      - name: Build image
        run: ./build.sh

      # This build's files are out/<image-name>.*; publish those and nothing
      # else that may be in out/.
      - name: Image name
        id: image
        run: echo "name=$(cat out/image-name)" >> "$GITHUB_OUTPUT"

      - name: Test
        run: tests/run.sh all

      - name: Summary
        run: |
          {
            echo "### Image build"
            echo "- rootfs used bytes: $(cat out/rootfs-used-bytes)"
            echo '```'
            ls -l out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: norns-image
          path: |
            out/${{ steps.image.outputs.name }}.img.zst
            out/${{ steps.image.outputs.name }}.img.zst.sha256
            out/${{ steps.image.outputs.name }}.sbom.zst
            out/${{ steps.image.outputs.name }}.manifest.zst
            out/rootfs-used-bytes
          if-no-files-found: error

  release:
    needs: build
    # tags on the fork only
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'sethbc/norns-image'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write   # gh release create
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: norns-image
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "out/$IMAGE.img.zst" "out/$IMAGE.img.zst.sha256" \
            "out/$IMAGE.sbom.zst" "out/$IMAGE.manifest.zst"
