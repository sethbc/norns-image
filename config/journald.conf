[Journal]
# On the SD card, so the previous boot's log (journalctl -b -1) survives a
# reboot, a crash or a hang.
Storage=persistent
# Write to disk every 15 s (default 5 min), so little is lost if the
# system hangs or loses power.
SyncIntervalSec=15s
# Bounded for an SD card, with room for several boots' logs.
SystemMaxUse=50M
