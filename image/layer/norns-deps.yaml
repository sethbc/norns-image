# METABEGIN
# X-Env-Layer-Name: norns-deps
# X-Env-Layer-Desc: libraries norns needs that trixie lacks: libgpiod 1.x
#  (matron uses the v1 API; trixie ships 2.x) in /opt/norns/libgpiod1,
#  liblo 0.31 (matron's lo_message typedef clashes with trixie's 0.32) in
#  /opt/norns/liblo031, and libmonome in /usr/local linked against that
#  liblo, all built from pinned release tags. The build tools stay in the
#  image (DKMS needs a compiler anyway).
# X-Env-Layer-Version: 1.1.0
# X-Env-Layer-Requires: norns-os
#
# X-Env-VarPrefix: norns
#
# X-Env-Var-assetdir: ${DIRECTORY}
# X-Env-Var-assetdir-Desc: Directory holding the norns layers and their
#  <layer>.d/ asset directories.
# X-Env-Var-assetdir-Required: n
# X-Env-Var-assetdir-Valid: dir
# X-Env-Var-assetdir-Set: y
#
# X-Env-Var-libgpiod1_tag:
# X-Env-Var-libgpiod1_tag-Desc: libgpiod v1 release tag (versions.env). The
#  pins have no defaults: build.sh passes them from versions.env.
# X-Env-Var-libgpiod1_tag-Required: y
# X-Env-Var-libgpiod1_tag-Valid: regex:^v1\.[0-9.]+$
# X-Env-Var-libgpiod1_tag-Set: y
#
# X-Env-Var-libgpiod1_commit:
# X-Env-Var-libgpiod1_commit-Desc: Commit the libgpiod tag must resolve to.
# X-Env-Var-libgpiod1_commit-Required: y
# X-Env-Var-libgpiod1_commit-Valid: regex:^[0-9a-f]{40}$
# X-Env-Var-libgpiod1_commit-Set: y
#
# X-Env-Var-liblo031_tag:
# X-Env-Var-liblo031_tag-Desc: liblo 0.31 release tag (versions.env).
# X-Env-Var-liblo031_tag-Required: y
# X-Env-Var-liblo031_tag-Valid: regex:^0\.31$
# X-Env-Var-liblo031_tag-Set: y
#
# X-Env-Var-liblo031_commit:
# X-Env-Var-liblo031_commit-Desc: Commit the liblo tag must resolve to.
# X-Env-Var-liblo031_commit-Required: y
# X-Env-Var-liblo031_commit-Valid: regex:^[0-9a-f]{40}$
# X-Env-Var-liblo031_commit-Set: y
#
# X-Env-Var-libmonome_tag:
# X-Env-Var-libmonome_tag-Desc: libmonome release tag (versions.env).
# X-Env-Var-libmonome_tag-Required: y
# X-Env-Var-libmonome_tag-Valid: regex:^v[0-9.]+$
# X-Env-Var-libmonome_tag-Set: y
#
# X-Env-Var-libmonome_commit:
# X-Env-Var-libmonome_commit-Desc: Commit the libmonome tag must resolve to.
# X-Env-Var-libmonome_commit-Required: y
# X-Env-Var-libmonome_commit-Valid: regex:^[0-9a-f]{40}$
# X-Env-Var-libmonome_commit-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - build-essential
    - pkg-config
    - autoconf
    - automake
    - libtool
    - autoconf-archive
    - python3
    - cmake
    - libudev-dev
    # libmonome builds its examples, which use curses
    - libncurses-dev
  customize-hooks:
    - ${IGconf_norns_assetdir}/norns-deps.d/build-libgpiod1.sh "$1" "${IGconf_norns_libgpiod1_tag}" "${IGconf_norns_libgpiod1_commit}"
    - ${IGconf_norns_assetdir}/norns-deps.d/build-liblo031.sh "$1" "${IGconf_norns_liblo031_tag}" "${IGconf_norns_liblo031_commit}"
    - ${IGconf_norns_assetdir}/norns-deps.d/build-libmonome.sh "$1" "${IGconf_norns_libmonome_tag}" "${IGconf_norns_libmonome_commit}"
