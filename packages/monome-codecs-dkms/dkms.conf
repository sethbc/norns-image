# DKMS package for the norns shield codec the Raspberry Pi kernels don't
# build: the Cirrus Logic CS4270 (cs4270.c, vendored from raspberrypi/linux;
# see its header). The CS4271 driver (snd-soc-cs4271, snd-soc-cs4271-i2c)
# is in the Pi kernels already, so it isn't built here.
# image/layer/norns-shield.d/install-shield.sh installs this as
# /usr/src/monome-codecs-1.0 and builds it for every kernel in the image;
# AUTOINSTALL builds it for each kernel installed later (apt upgrade).
PACKAGE_NAME="monome-codecs"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="snd-soc-cs4270"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
